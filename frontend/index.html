<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S Brain Test</title>
<style>
  body{background:#000;color:#0ff;font-family:monospace;padding:20px}
  h1{text-align:center;letter-spacing:4px}
  #status{color:#f00;text-align:center;margin-bottom:15px;font-weight:bold}
  textarea{width:100%;background:#001a1a;color:#0ff;border:1px solid #0ff;padding:10px;box-sizing:border-box}
  button{width:100%;padding:14px;background:#0ff;color:#000;font-weight:bold;border:none;margin-top:10px;font-size:16px}
  #reply{border:1px solid #0ff;padding:12px;margin-top:15px;min-height:100px;white-space:pre-wrap;color:#fff}
</style>
</head>
<body>
<h1>J.A.R.V.I.S</h1>
<div id="status">BRAIN: NOT CONNECTED</div>
<textarea id="prompt" rows="4">Hello J.A.R.V.I.S</textarea>
<button onclick="ask()">SEND REQUEST</button>
<div id="reply">Waiting for response...</div>

<script>
// ⚠️ PASTE YOUR API KEY BELOW (Inside the quotes)
const API_KEY = "("Enter Gemini API key");";
// Tried in order. If one is busy or unavailable, the next is used.
const MODELS = [
  "gemini-3.5-flash-lite",
  "gemini-3.1-flash-lite",
  "gemini-3.6-flash",
  "gemini-3.8-flash"
];

async function ask(){
  const reply = document.getElementById("reply");
  const status = document.getElementById("status");
  reply.innerText = "PROCESSING...";
  status.style.color = "#f00";
  let lastError = "";

  for(let i = 0; i < MODELS.length; i++){
    const model = MODELS[i];
    status.innerText = "CONNECTING (" + model + ")...";
    try{
      const res = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + API_KEY,
        {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            contents:[{ parts:[{ text: document.getElementById("prompt").value }] }]
          })
        }
      );
      const data = await res.json();

      if(data.candidates && data.candidates[0]){
        reply.innerText = data.candidates[0].content.parts[0].text;
        status.innerText = "✓ BRAIN ONLINE (" + model + ")";
        status.style.color = "#0f0";
        return;
      }

      lastError = JSON.stringify(data);
      const code = data.error && data.error.code;
      // Bad API key or bad request: other models will fail too, so stop
      if(code === 400 || code === 401 || code === 403){
        break;
      }
      // 503 busy, 429 limit, 404 model missing: try the next model
      reply.innerText = model + " unavailable, trying next...";
      await new Promise(r => setTimeout(r, 1000));

    }catch(e){
      reply.innerText = "NETWORK ERROR: " + e.message;
      status.innerText = "CONNECTION FAILED";
      return;
    }
  }

  reply.innerText = "ERROR: " + lastError;
  status.innerText = "BRAIN ERROR";
}
</script>
</body>
</html>
